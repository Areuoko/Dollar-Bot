name: Check Dollar Price

on:
  repository_dispatch: # منتظر دستور تریگر از بیرون (کلودفلر)
    types: [trigger-bot]
  workflow_dispatch: # برای اجرای دستی در صورت نیاز

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # آخرین نسخه رسمی برای پایداری بیشتر

      - name: Set up Python
        uses: actions/setup-python@v5 # آخرین نسخه رسمی
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env: 
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # 🟢 تزریق امن متغیرها به فایل پایتون
          CLOUDFLARE_URL: ${{ secrets.CLOUDFLARE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: python main.py
