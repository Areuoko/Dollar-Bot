name: Check Dollar Price

on:
  repository_dispatch: # این یعنی منتظر دستور از بیرون باش
    types: [trigger-bot]
  workflow_dispatch: # برای اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          CLOUDFLARE_URL: ${{ secrets.CLOUDFLARE_URL }}
        run: python main.py
